# ==========================================
# CALIO360 — Docker Compose (Desarrollo)
# ==========================================
# Uso: docker compose up -d
# Todos los puertos expuestos para debugging local.
# ==========================================

services:
  # ==========================================
  # INFRAESTRUCTURA
  # ==========================================
  calio-postgres:
    image: postgres:15-alpine
    container_name: calio-postgres
    environment:
      POSTGRES_USER: ${CALIO_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${CALIO_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: calio_identity_db
    ports:
      - "5432:5432"
    volumes:
      - calio_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calio-network

  calio-mongodb:
    image: mongo:6
    container_name: calio-mongodb
    ports:
      - "27017:27017"
    volumes:
      - calio_mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calio-network

  calio-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: calio-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${CALIO_RABBITMQ_USER:-calio_admin}
      RABBITMQ_DEFAULT_PASS: ${CALIO_RABBITMQ_PASSWORD:-calio_admin}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - calio_rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calio-network

  # ==========================================
  # SERVICIOS JAVA (Spring Boot)
  # ==========================================
  calio-identity-service:
    build: ./services/identity-service
    container_name: calio-identity-service
    ports:
      - "8081:8081"
    environment:
      CALIO_IDENTITY_DB_HOST: calio-postgres
      CALIO_IDENTITY_DB_PORT: 5432
      CALIO_IDENTITY_DB_NAME: calio_identity_db
      CALIO_IDENTITY_DB_USER: ${CALIO_POSTGRES_USER:-postgres}
      CALIO_IDENTITY_DB_PASSWORD: ${CALIO_POSTGRES_PASSWORD:-postgres}
      CALIO_RABBITMQ_HOST: calio-rabbitmq
      CALIO_RABBITMQ_PORT: 5672
      CALIO_RABBITMQ_USER: ${CALIO_RABBITMQ_USER:-calio_admin}
      CALIO_RABBITMQ_PASSWORD: ${CALIO_RABBITMQ_PASSWORD:-calio_admin}
      CALIO_JWT_SECRET: ${CALIO_JWT_SECRET:-calio-secret-key-2026-prod-very-secure-minimum-256-bits-long}
      CALIO_JWT_EXPIRATION: ${CALIO_JWT_EXPIRATION:-86400000}
      CALIO_REFRESH_EXPIRATION: ${CALIO_REFRESH_EXPIRATION:-604800000}
    depends_on:
      calio-postgres:
        condition: service_healthy
      calio-rabbitmq:
        condition: service_healthy
    networks:
      - calio-network

  calio-food-service:
    build: ./services/food-catalog-service
    container_name: calio-food-service
    ports:
      - "8083:8083"
    environment:
      CALIO_FOOD_DB_HOST: calio-postgres
      CALIO_FOOD_DB_PORT: 5432
      CALIO_FOOD_DB_NAME: calio_food_db
      CALIO_FOOD_DB_USER: ${CALIO_POSTGRES_USER:-postgres}
      CALIO_FOOD_DB_PASSWORD: ${CALIO_POSTGRES_PASSWORD:-postgres}
      CALIO_RABBITMQ_HOST: calio-rabbitmq
      CALIO_RABBITMQ_PORT: 5672
      CALIO_RABBITMQ_USER: ${CALIO_RABBITMQ_USER:-calio_admin}
      CALIO_RABBITMQ_PASSWORD: ${CALIO_RABBITMQ_PASSWORD:-calio_admin}
      CALIO_JWT_SECRET: ${CALIO_JWT_SECRET:-calio-secret-key-2026-prod-very-secure-minimum-256-bits-long}
    depends_on:
      calio-postgres:
        condition: service_healthy
    networks:
      - calio-network

  calio-recipe-service:
    build: ./services/recipe-service
    container_name: calio-recipe-service
    ports:
      - "8084:8084"
    environment:
      CALIO_RECIPE_DB_HOST: calio-postgres
      CALIO_RECIPE_DB_PORT: 5432
      CALIO_RECIPE_DB_NAME: calio_recipe_db
      CALIO_RECIPE_DB_USER: ${CALIO_POSTGRES_USER:-postgres}
      CALIO_RECIPE_DB_PASSWORD: ${CALIO_POSTGRES_PASSWORD:-postgres}
      CALIO_GEMINI_API_KEY: ${CALIO_GEMINI_API_KEY}
      CALIO_GEMINI_MODEL: ${CALIO_GEMINI_MODEL:-gemini-2.5-flash}
      CALIO_FOOD_SERVICE_URL: http://calio-food-service:8083
    depends_on:
      calio-postgres:
        condition: service_healthy
    networks:
      - calio-network

  calio-tracking-service:
    build: ./services/tracking-service
    container_name: calio-tracking-service
    ports:
      - "8085:8085"
    environment:
      CALIO_TRACKING_DB_HOST: calio-postgres
      CALIO_TRACKING_DB_PORT: 5432
      CALIO_TRACKING_DB_NAME: calio_tracking_db
      CALIO_TRACKING_DB_USER: ${CALIO_POSTGRES_USER:-postgres}
      CALIO_TRACKING_DB_PASSWORD: ${CALIO_POSTGRES_PASSWORD:-postgres}
      CALIO_RABBITMQ_HOST: calio-rabbitmq
      CALIO_RABBITMQ_PORT: 5672
      CALIO_RABBITMQ_USER: ${CALIO_RABBITMQ_USER:-calio_admin}
      CALIO_RABBITMQ_PASSWORD: ${CALIO_RABBITMQ_PASSWORD:-calio_admin}
    depends_on:
      calio-postgres:
        condition: service_healthy
      calio-rabbitmq:
        condition: service_healthy
    volumes:
      - calio_images_data:/app/images/
    networks:
      - calio-network

  calio-wearable-service:
    build: ./services/wearable-service
    container_name: calio-wearable-service
    ports:
      - "8088:8088"
    environment:
      CALIO_WEARABLE_DB_HOST: calio-postgres
      CALIO_WEARABLE_DB_PORT: 5432
      CALIO_WEARABLE_DB_NAME: calio_wearable_db
      CALIO_WEARABLE_DB_USER: ${CALIO_POSTGRES_USER:-postgres}
      CALIO_WEARABLE_DB_PASSWORD: ${CALIO_POSTGRES_PASSWORD:-postgres}
      CALIO_RABBITMQ_HOST: calio-rabbitmq
      CALIO_RABBITMQ_PORT: 5672
      CALIO_RABBITMQ_USER: ${CALIO_RABBITMQ_USER:-calio_admin}
      CALIO_RABBITMQ_PASSWORD: ${CALIO_RABBITMQ_PASSWORD:-calio_admin}
    depends_on:
      calio-postgres:
        condition: service_healthy
      calio-rabbitmq:
        condition: service_healthy
    networks:
      - calio-network

  calio-exercise-service:
    build: ./services/exercise-service
    container_name: calio-exercise-service
    ports:
      - "8089:8089"
    environment:
      CALIO_EXERCISE_DB_HOST: calio-postgres
      CALIO_EXERCISE_DB_PORT: 5432
      CALIO_EXERCISE_DB_NAME: calio_exercise_db
      CALIO_EXERCISE_DB_USER: ${CALIO_POSTGRES_USER:-postgres}
      CALIO_EXERCISE_DB_PASSWORD: ${CALIO_POSTGRES_PASSWORD:-postgres}
      CALIO_RABBITMQ_HOST: calio-rabbitmq
      CALIO_RABBITMQ_PORT: 5672
      CALIO_RABBITMQ_USER: ${CALIO_RABBITMQ_USER:-calio_admin}
      CALIO_RABBITMQ_PASSWORD: ${CALIO_RABBITMQ_PASSWORD:-calio_admin}
    depends_on:
      calio-postgres:
        condition: service_healthy
      calio-rabbitmq:
        condition: service_healthy
    networks:
      - calio-network

  # ==========================================
  # SERVICIOS PYTHON (Flask + Gunicorn)
  # ==========================================
  calio-ai-service:
    build: ./services/ai-food-service
    container_name: calio-ai-service
    ports:
      - "8082:8082"
    environment:
      CALIO_GEMINI_API_KEY: ${CALIO_GEMINI_API_KEY}
      CALIO_GEMINI_MODEL: ${CALIO_GEMINI_MODEL:-gemini-2.5-flash}
    networks:
      - calio-network

  calio-analytics-service:
    build: ./services/analytics-service
    container_name: calio-analytics-service
    ports:
      - "8086:8086"
    environment:
      CALIO_ANALYTICS_MONGO_URI: mongodb://calio-mongodb:27017/calio_analytics_db
      CALIO_RABBITMQ_HOST: calio-rabbitmq
      CALIO_RABBITMQ_PORT: 5672
      CALIO_RABBITMQ_USER: ${CALIO_RABBITMQ_USER:-calio_admin}
      CALIO_RABBITMQ_PASSWORD: ${CALIO_RABBITMQ_PASSWORD:-calio_admin}
    depends_on:
      calio-mongodb:
        condition: service_healthy
      calio-rabbitmq:
        condition: service_healthy
    networks:
      - calio-network

  # ==========================================
  # SERVICIO NODE.JS (Hono)
  # ==========================================
  calio-notification-service:
    build: ./services/notification-service
    container_name: calio-notification-service
    ports:
      - "8087:8087"
    environment:
      CALIO_NOTIFICATION_MONGO_URI: mongodb://calio-mongodb:27017/calio_notification_db
      CALIO_RABBITMQ_HOST: calio-rabbitmq
      CALIO_RABBITMQ_PORT: 5672
      CALIO_RABBITMQ_USER: ${CALIO_RABBITMQ_USER:-calio_admin}
      CALIO_RABBITMQ_PASSWORD: ${CALIO_RABBITMQ_PASSWORD:-calio_admin}
    depends_on:
      calio-mongodb:
        condition: service_healthy
      calio-rabbitmq:
        condition: service_healthy
    networks:
      - calio-network

  # ==========================================
  # GATEWAY + PROXY
  # ==========================================
  calio-gateway:
    build: ./services/gateway-service
    container_name: calio-gateway
    ports:
      - "8080:8080"
    environment:
      CALIO_JWT_SECRET: ${CALIO_JWT_SECRET:-calio-secret-key-2026-prod-very-secure-minimum-256-bits-long}
      CALIO_IDENTITY_SERVICE_URL: http://calio-identity-service:8081
      CALIO_AI_SERVICE_URL: http://calio-ai-service:8082
      CALIO_FOOD_SERVICE_URL: http://calio-food-service:8083
      CALIO_RECIPE_SERVICE_URL: http://calio-recipe-service:8084
      CALIO_TRACKING_SERVICE_URL: http://calio-tracking-service:8085
      CALIO_ANALYTICS_SERVICE_URL: http://calio-analytics-service:8086
      CALIO_NOTIFICATION_SERVICE_URL: http://calio-notification-service:8087
      CALIO_WEARABLE_SERVICE_URL: http://calio-wearable-service:8088
      CALIO_EXERCISE_SERVICE_URL: http://calio-exercise-service:8089
    depends_on:
      - calio-identity-service
      - calio-ai-service
      - calio-food-service
      - calio-recipe-service
      - calio-tracking-service
      - calio-analytics-service
      - calio-notification-service
      - calio-wearable-service
      - calio-exercise-service
    networks:
      - calio-network

  nginx:
    image: nginx:alpine
    container_name: calio-nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx-init.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - calio-gateway
    networks:
      - calio-network

# ==========================================
# VOLUMES
# ==========================================
volumes:
  calio_postgres_data:
  calio_mongodb_data:
  calio_rabbitmq_data:
  calio_images_data:

# ==========================================
# NETWORK
# ==========================================
networks:
  calio-network:
    driver: bridge
