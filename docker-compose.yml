version: '3.8'

services:
  # ==========================================
  # INFRAESTRUCTURA
  # ==========================================
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-calio_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-calio_pass}
      POSTGRES_DB: ${DB_NAME:-calio}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calio_user -d calio"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # SERVICIOS JAVA (Spring Boot)
  # ==========================================
  identity-service:
    build: ./services/identity-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: calio
      DB_USER: ${DB_USER:-calio_user}
      DB_PASSWORD: ${DB_PASSWORD:-calio_pass}
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:-calio-secret-key-2026-prod-very-secure-minimum-256-bits-long}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  food-catalog-service:
    build: ./services/food-catalog-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_NAME: calio
      DB_USER: ${DB_USER:-calio_user}
      DB_PASSWORD: ${DB_PASSWORD:-calio_pass}
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:-calio-secret-key-2026-prod-very-secure-minimum-256-bits-long}
    depends_on:
      postgres:
        condition: service_healthy

  recipe-service:
    build: ./services/recipe-service
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_NAME: calio
      DB_USER: ${DB_USER:-calio_user}
      DB_PASSWORD: ${DB_PASSWORD:-calio_pass}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CATALOG_SERVICE_URL: http://food-catalog-service:8083
    depends_on:
      postgres:
        condition: service_healthy

  tracking-service:
    build: ./services/tracking-service
    ports:
      - "8085:8085"
    environment:
      DB_HOST: postgres
      DB_NAME: calio
      DB_USER: ${DB_USER:-calio_user}
      DB_PASSWORD: ${DB_PASSWORD:-calio_pass}
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  wearable-service:
    build: ./services/wearable-service
    ports:
      - "8088:8088"
    environment:
      DB_HOST: postgres
      DB_NAME: calio
      DB_USER: ${DB_USER:-calio_user}
      DB_PASSWORD: ${DB_PASSWORD:-calio_pass}
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  exercise-service:
    build: ./services/exercise-service
    ports:
      - "8090:8090"
    environment:
      DB_HOST: postgres
      DB_NAME: calio
      DB_USER: ${DB_USER:-calio_user}
      DB_PASSWORD: ${DB_PASSWORD:-calio_pass}
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ==========================================
  # SERVICIOS PYTHON (Flask)
  # ==========================================
  ai-food-service:
    build: ./services/ai-food-service
    ports:
      - "8082:8082"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}

  analytics-service:
    build: ./services/analytics-service
    ports:
      - "8086:8086"
    environment:
      MONGO_URI: mongodb://mongo:27017/calio_analytics
      RABBITMQ_HOST: rabbitmq
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ==========================================
  # SERVICIO NODE.JS (Hono)
  # ==========================================
  notification-service:
    build: ./services/notification-service
    ports:
      - "8087:8087"
    environment:
      MONGO_URI: mongodb://mongo:27017/calio_notifications
      RABBITMQ_HOST: rabbitmq
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ==========================================
  # GATEWAY + PROXY
  # ==========================================
  gateway-service:
    build: ./services/gateway-service
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-calio-secret-key-2026-prod-very-secure-minimum-256-bits-long}
      IDENTITY_URL: http://identity-service:8081
      AI_FOOD_URL: http://ai-food-service:8082
      FOOD_CATALOG_URL: http://food-catalog-service:8083
      RECIPE_URL: http://recipe-service:8084
      TRACKING_URL: http://tracking-service:8085
      ANALYTICS_URL: http://analytics-service:8086
      NOTIFICATION_URL: http://notification-service:8087
      WEARABLE_URL: http://wearable-service:8088
      EXERCISE_URL: http://exercise-service:8090
    depends_on:
      - identity-service
      - ai-food-service
      - food-catalog-service
      - recipe-service
      - tracking-service
      - analytics-service
      - notification-service
      - wearable-service
      - exercise-service

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-service

volumes:
  pg_data:
  mongo_data:
