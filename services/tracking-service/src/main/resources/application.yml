server:
  port: 8085

spring:
  application:
    name: calio-tracking-service

  datasource:
    url: jdbc:postgresql://${CALIO_TRACKING_DB_HOST:calio-postgres}:${CALIO_TRACKING_DB_PORT:5432}/${CALIO_TRACKING_DB_NAME:calio_tracking_db}
    username: ${CALIO_TRACKING_DB_USER:postgres}
    password: ${CALIO_TRACKING_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${CALIO_RABBITMQ_HOST:calio-rabbitmq}
    port: ${CALIO_RABBITMQ_PORT:5672}
    username: ${CALIO_RABBITMQ_USER:calio_admin}
    password: ${CALIO_RABBITMQ_PASSWORD:calio_admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.calio: INFO
