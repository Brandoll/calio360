server:
  port: 8080

spring:
  application:
    name: calio-gateway

  cloud:
    gateway:
      routes:
        # ===== Identity Service =====
        - id: calio-identity-service
          uri: ${CALIO_IDENTITY_SERVICE_URL:http://calio-identity-service:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2

        # ===== AI Service =====
        - id: calio-ai-service
          uri: ${CALIO_AI_SERVICE_URL:http://calio-ai-service:8082}
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=2

        # ===== Food Service =====
        - id: calio-food-service
          uri: ${CALIO_FOOD_SERVICE_URL:http://calio-food-service:8083}
          predicates:
            - Path=/api/foods/**
          filters:
            - StripPrefix=2

        # ===== Recipe Service =====
        - id: calio-recipe-service
          uri: ${CALIO_RECIPE_SERVICE_URL:http://calio-recipe-service:8084}
          predicates:
            - Path=/api/recipes/**
          filters:
            - StripPrefix=2

        # ===== Tracking Service =====
        - id: calio-tracking-service
          uri: ${CALIO_TRACKING_SERVICE_URL:http://calio-tracking-service:8085}
          predicates:
            - Path=/api/tracking/**
          filters:
            - StripPrefix=2

        # ===== Analytics Service =====
        - id: calio-analytics-service
          uri: ${CALIO_ANALYTICS_SERVICE_URL:http://calio-analytics-service:8086}
          predicates:
            - Path=/api/analytics/**
          filters:
            - StripPrefix=2

        # ===== Notification Service =====
        - id: calio-notification-service
          uri: ${CALIO_NOTIFICATION_SERVICE_URL:http://calio-notification-service:8087}
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=2

        # ===== Wearable Service =====
        - id: calio-wearable-service
          uri: ${CALIO_WEARABLE_SERVICE_URL:http://calio-wearable-service:8088}
          predicates:
            - Path=/api/wearables/**
          filters:
            - StripPrefix=2

        # ===== Exercise Service =====
        - id: calio-exercise-service
          uri: ${CALIO_EXERCISE_SERVICE_URL:http://calio-exercise-service:8089}
          predicates:
            - Path=/api/exercises/**
          filters:
            - StripPrefix=2

      # CORS para React Native (producción)
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

calio:
  jwt:
    secret: ${CALIO_JWT_SECRET:calio-secret-key-2026-prod-very-secure-minimum-256-bits-long}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.calio: INFO
    org.springframework.cloud.gateway: WARN
