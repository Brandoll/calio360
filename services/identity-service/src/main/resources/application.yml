server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: calio-identity-service

  datasource:
    url: jdbc:postgresql://${CALIO_IDENTITY_DB_HOST:calio-postgres}:${CALIO_IDENTITY_DB_PORT:5432}/${CALIO_IDENTITY_DB_NAME:calio_identity_db}
    username: ${CALIO_IDENTITY_DB_USER:postgres}
    password: ${CALIO_IDENTITY_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

  rabbitmq:
    host: ${CALIO_RABBITMQ_HOST:calio-rabbitmq}
    port: ${CALIO_RABBITMQ_PORT:5672}
    username: ${CALIO_RABBITMQ_USER:calio_admin}
    password: ${CALIO_RABBITMQ_PASSWORD:calio_admin}
    virtual-host: /

calio:
  jwt:
    secret: ${CALIO_JWT_SECRET:calio-secret-key-2026-prod-very-secure-minimum-256-bits-long}
    expiration-ms: ${CALIO_JWT_EXPIRATION:86400000}
    refresh-expiration-ms: ${CALIO_REFRESH_EXPIRATION:604800000}

  rabbitmq:
    exchange: calio.events
    routing-keys:
      user-registered: user.registered
      profile-updated: user.profile.updated
      account-deleted: user.account.deleted

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false

logging:
  level:
    com.calio: INFO
    org.springframework.security: WARN
