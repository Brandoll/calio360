server:
  port: 8084

spring:
  application:
    name: calio-recipe-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:calio}
    username: ${DB_USER:calio_user}
    password: ${DB_PASSWORD:calio_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

calio:
  gemini:
    api-key: ${GEMINI_API_KEY}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8083}
