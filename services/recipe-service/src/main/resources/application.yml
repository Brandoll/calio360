server:
  port: 8084

spring:
  application:
    name: calio-recipe-service

  datasource:
    url: jdbc:postgresql://${CALIO_RECIPE_DB_HOST:calio-postgres}:${CALIO_RECIPE_DB_PORT:5432}/${CALIO_RECIPE_DB_NAME:calio_recipe_db}
    username: ${CALIO_RECIPE_DB_USER:postgres}
    password: ${CALIO_RECIPE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

calio:
  gemini:
    api-key: ${CALIO_GEMINI_API_KEY}
    model: ${CALIO_GEMINI_MODEL:gemini-2.5-flash}
    url: https://generativelanguage.googleapis.com/v1beta/models/${CALIO_GEMINI_MODEL:gemini-2.5-flash}:generateContent
  catalog:
    url: ${CALIO_FOOD_SERVICE_URL:http://calio-food-service:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.calio: INFO
