server:
  port: 8090

spring:
  application:
    name: exercise-service
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/calio
    username: ${DB_USER:calio_user}
    password: ${DB_PASSWORD:calio_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  web:
    resources:
      static-locations: classpath:/static/

logging:
  level:
    root: INFO
    com.calio.exercise: DEBUG
