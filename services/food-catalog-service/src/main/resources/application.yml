server:
  port: 8083

spring:
  application:
    name: calio-food-service

  datasource:
    url: jdbc:postgresql://${CALIO_FOOD_DB_HOST:calio-postgres}:${CALIO_FOOD_DB_PORT:5432}/${CALIO_FOOD_DB_NAME:calio_food_db}
    username: ${CALIO_FOOD_DB_USER:postgres}
    password: ${CALIO_FOOD_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed_alimentos.sql

  rabbitmq:
    host: ${CALIO_RABBITMQ_HOST:calio-rabbitmq}
    port: ${CALIO_RABBITMQ_PORT:5672}
    username: ${CALIO_RABBITMQ_USER:calio_admin}
    password: ${CALIO_RABBITMQ_PASSWORD:calio_admin}

calio:
  jwt:
    secret: ${CALIO_JWT_SECRET:calio-secret-key-2026-prod-very-secure-minimum-256-bits-long}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.calio: INFO
