server:
  port: 8083

spring:
  application:
    name: calio-food-catalog-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:calio}
    username: ${DB_USER:calio_user}
    password: ${DB_PASSWORD:calio_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed_alimentos.sql

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

calio:
  jwt:
    secret: ${JWT_SECRET:-cali0-super-secret-key-for-jwt-signing-256bits!!}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.calio: DEBUG
