# ==========================================
# CALIO360 — Docker Compose (Producción)
# ==========================================
# Uso: docker compose -f docker-compose.prod.yml up -d
#
# IMPORTANTE: Crear .env con valores reales antes de ejecutar.
# Copiar .env.example como .env y rellenar todos los valores.
# ==========================================

services:
  # ==========================================
  # INFRAESTRUCTURA
  # ==========================================
  calio-postgres:
    image: postgres:15-alpine
    container_name: calio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CALIO_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CALIO_POSTGRES_PASSWORD}
      POSTGRES_DB: calio_identity_db
    volumes:
      - calio_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CALIO_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - calio-network

  calio-mongodb:
    image: mongo:6
    container_name: calio-mongodb
    restart: unless-stopped
    volumes:
      - calio_mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - calio-network

  calio-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: calio-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${CALIO_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${CALIO_RABBITMQ_PASSWORD}
    volumes:
      - calio_rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - calio-network

  # ==========================================
  # SERVICIOS JAVA (Spring Boot)
  # ==========================================
  calio-identity-service:
    build: ./services/identity-service
    container_name: calio-identity-service
    restart: unless-stopped
    environment:
      CALIO_IDENTITY_DB_HOST: calio-postgres
      CALIO_IDENTITY_DB_PORT: 5432
      CALIO_IDENTITY_DB_NAME: calio_identity_db
      CALIO_IDENTITY_DB_USER: ${CALIO_POSTGRES_USER}
      CALIO_IDENTITY_DB_PASSWORD: ${CALIO_POSTGRES_PASSWORD}
      CALIO_RABBITMQ_HOST: calio-rabbitmq
      CALIO_RABBITMQ_PORT: 5672
      CALIO_RABBITMQ_USER: ${CALIO_RABBITMQ_USER}
      CALIO_RABBITMQ_PASSWORD: ${CALIO_RABBITMQ_PASSWORD}
      CALIO_JWT_SECRET: ${CALIO_JWT_SECRET}
      CALIO_JWT_EXPIRATION: ${CALIO_JWT_EXPIRATION}
      CALIO_REFRESH_EXPIRATION: ${CALIO_REFRESH_EXPIRATION}
    volumes:
      - calio_identity_logs:/app/logs
    depends_on:
      calio-postgres:
        condition: service_healthy
      calio-rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - calio-network

  calio-food-service:
    build: ./services/food-catalog-service
    container_name: calio-food-service
    restart: unless-stopped
    environment:
      CALIO_FOOD_DB_HOST: calio-postgres
      CALIO_FOOD_DB_PORT: 5432
      CALIO_FOOD_DB_NAME: calio_food_db
      CALIO_FOOD_DB_USER: ${CALIO_POSTGRES_USER}
      CALIO_FOOD_DB_PASSWORD: ${CALIO_POSTGRES_PASSWORD}
      CALIO_RABBITMQ_HOST: calio-rabbitmq
      CALIO_RABBITMQ_PORT: 5672
      CALIO_RABBITMQ_USER: ${CALIO_RABBITMQ_USER}
      CALIO_RABBITMQ_PASSWORD: ${CALIO_RABBITMQ_PASSWORD}
      CALIO_JWT_SECRET: ${CALIO_JWT_SECRET}
    volumes:
      - calio_food_logs:/app/logs
    depends_on:
      calio-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - calio-network

  calio-recipe-service:
    build: ./services/recipe-service
    container_name: calio-recipe-service
    restart: unless-stopped
    environment:
      CALIO_RECIPE_DB_HOST: calio-postgres
      CALIO_RECIPE_DB_PORT: 5432
      CALIO_RECIPE_DB_NAME: calio_recipe_db
      CALIO_RECIPE_DB_USER: ${CALIO_POSTGRES_USER}
      CALIO_RECIPE_DB_PASSWORD: ${CALIO_POSTGRES_PASSWORD}
      CALIO_GEMINI_API_KEY: ${CALIO_GEMINI_API_KEY}
      CALIO_GEMINI_MODEL: ${CALIO_GEMINI_MODEL}
      CALIO_FOOD_SERVICE_URL: http://calio-food-service:8083
    volumes:
      - calio_recipe_logs:/app/logs
    depends_on:
      calio-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - calio-network

  calio-tracking-service:
    build: ./services/tracking-service
    container_name: calio-tracking-service
    restart: unless-stopped
    environment:
      CALIO_TRACKING_DB_HOST: calio-postgres
      CALIO_TRACKING_DB_PORT: 5432
      CALIO_TRACKING_DB_NAME: calio_tracking_db
      CALIO_TRACKING_DB_USER: ${CALIO_POSTGRES_USER}
      CALIO_TRACKING_DB_PASSWORD: ${CALIO_POSTGRES_PASSWORD}
      CALIO_RABBITMQ_HOST: calio-rabbitmq
      CALIO_RABBITMQ_PORT: 5672
      CALIO_RABBITMQ_USER: ${CALIO_RABBITMQ_USER}
      CALIO_RABBITMQ_PASSWORD: ${CALIO_RABBITMQ_PASSWORD}
    volumes:
      - calio_tracking_logs:/app/logs
      - calio_tracking_images:/app/images
    depends_on:
      calio-postgres:
        condition: service_healthy
      calio-rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - calio-network

  calio-wearable-service:
    build: ./services/wearable-service
    container_name: calio-wearable-service
    restart: unless-stopped
    environment:
      CALIO_WEARABLE_DB_HOST: calio-postgres
      CALIO_WEARABLE_DB_PORT: 5432
      CALIO_WEARABLE_DB_NAME: calio_wearable_db
      CALIO_WEARABLE_DB_USER: ${CALIO_POSTGRES_USER}
      CALIO_WEARABLE_DB_PASSWORD: ${CALIO_POSTGRES_PASSWORD}
      CALIO_RABBITMQ_HOST: calio-rabbitmq
      CALIO_RABBITMQ_PORT: 5672
      CALIO_RABBITMQ_USER: ${CALIO_RABBITMQ_USER}
      CALIO_RABBITMQ_PASSWORD: ${CALIO_RABBITMQ_PASSWORD}
    volumes:
      - calio_wearable_logs:/app/logs
    depends_on:
      calio-postgres:
        condition: service_healthy
      calio-rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - calio-network

  calio-exercise-service:
    build: ./services/exercise-service
    container_name: calio-exercise-service
    restart: unless-stopped
    environment:
      CALIO_EXERCISE_DB_HOST: calio-postgres
      CALIO_EXERCISE_DB_PORT: 5432
      CALIO_EXERCISE_DB_NAME: calio_exercise_db
      CALIO_EXERCISE_DB_USER: ${CALIO_POSTGRES_USER}
      CALIO_EXERCISE_DB_PASSWORD: ${CALIO_POSTGRES_PASSWORD}
      CALIO_RABBITMQ_HOST: calio-rabbitmq
      CALIO_RABBITMQ_PORT: 5672
      CALIO_RABBITMQ_USER: ${CALIO_RABBITMQ_USER}
      CALIO_RABBITMQ_PASSWORD: ${CALIO_RABBITMQ_PASSWORD}
    volumes:
      - calio_exercise_logs:/app/logs
    depends_on:
      calio-postgres:
        condition: service_healthy
      calio-rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - calio-network

  # ==========================================
  # SERVICIOS PYTHON
  # ==========================================
  calio-ai-service:
    build: ./services/ai-food-service
    container_name: calio-ai-service
    restart: unless-stopped
    environment:
      CALIO_GEMINI_API_KEY: ${CALIO_GEMINI_API_KEY}
      CALIO_GEMINI_MODEL: ${CALIO_GEMINI_MODEL}
    volumes:
      - calio_ai_logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - calio-network

  calio-analytics-service:
    build: ./services/analytics-service
    container_name: calio-analytics-service
    restart: unless-stopped
    environment:
      CALIO_ANALYTICS_MONGO_URI: mongodb://calio-mongodb:27017/calio_analytics_db
      CALIO_RABBITMQ_HOST: calio-rabbitmq
      CALIO_RABBITMQ_PORT: 5672
      CALIO_RABBITMQ_USER: ${CALIO_RABBITMQ_USER}
      CALIO_RABBITMQ_PASSWORD: ${CALIO_RABBITMQ_PASSWORD}
    volumes:
      - calio_analytics_logs:/app/logs
    depends_on:
      calio-mongodb:
        condition: service_healthy
      calio-rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - calio-network

  # ==========================================
  # SERVICIO NODE.JS
  # ==========================================
  calio-notification-service:
    build: ./services/notification-service
    container_name: calio-notification-service
    restart: unless-stopped
    environment:
      CALIO_NOTIFICATION_MONGO_URI: mongodb://calio-mongodb:27017/calio_notification_db
      CALIO_RABBITMQ_HOST: calio-rabbitmq
      CALIO_RABBITMQ_PORT: 5672
      CALIO_RABBITMQ_USER: ${CALIO_RABBITMQ_USER}
      CALIO_RABBITMQ_PASSWORD: ${CALIO_RABBITMQ_PASSWORD}
    volumes:
      - calio_notification_logs:/app/logs
    depends_on:
      calio-mongodb:
        condition: service_healthy
      calio-rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - calio-network

  # ==========================================
  # GATEWAY
  # ==========================================
  calio-gateway:
    build: ./services/gateway-service
    container_name: calio-gateway
    restart: unless-stopped
    environment:
      CALIO_JWT_SECRET: ${CALIO_JWT_SECRET}
      CALIO_IDENTITY_SERVICE_URL: http://calio-identity-service:8081
      CALIO_AI_SERVICE_URL: http://calio-ai-service:8082
      CALIO_FOOD_SERVICE_URL: http://calio-food-service:8083
      CALIO_RECIPE_SERVICE_URL: http://calio-recipe-service:8084
      CALIO_TRACKING_SERVICE_URL: http://calio-tracking-service:8085
      CALIO_ANALYTICS_SERVICE_URL: http://calio-analytics-service:8086
      CALIO_NOTIFICATION_SERVICE_URL: http://calio-notification-service:8087
      CALIO_WEARABLE_SERVICE_URL: http://calio-wearable-service:8088
      CALIO_EXERCISE_SERVICE_URL: http://calio-exercise-service:8089
    depends_on:
      - calio-identity-service
      - calio-ai-service
      - calio-food-service
      - calio-recipe-service
      - calio-tracking-service
      - calio-analytics-service
      - calio-notification-service
      - calio-wearable-service
      - calio-exercise-service
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - calio-network

# ==========================================
# VOLUMES
# ==========================================
volumes:
  calio_postgres_data:
  calio_mongodb_data:
  calio_rabbitmq_data:
  calio_identity_logs:
  calio_food_logs:
  calio_tracking_logs:
  calio_tracking_images:
  calio_recipe_logs:
  calio_ai_logs:
  calio_analytics_logs:
  calio_notification_logs:
  calio_wearable_logs:
  calio_exercise_logs:

# ==========================================
# NETWORK
# ==========================================
networks:
  calio-network:
    external: true
