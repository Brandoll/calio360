worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    # ==========================================
    # GENERAL
    # ==========================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 20M;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==========================================
    # LOGGING
    # ==========================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ==========================================
    # COMPRESIÓN GZIP
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/plain
        text/css
        text/xml;

    # ==========================================
    # RATE LIMITING
    # ==========================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # ==========================================
    # TIMEOUTS
    # ==========================================
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;

    # ==========================================
    # BUFFER SIZES
    # ==========================================
    proxy_buffer_size     128k;
    proxy_buffers         4 256k;
    proxy_busy_buffers_size 256k;

    # ==========================================
    # UPSTREAM: CALIO GATEWAY
    # ==========================================
    upstream calio_gateway {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    # ==========================================
    # HTTP → HTTPS REDIRECT
    # ==========================================
    server {
        listen 80;
        server_name api.calio360.app calio360.app;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect todo lo demás a HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================
    # HTTPS: api.calio360.app
    # ==========================================
    server {
        listen 443 ssl http2;
        server_name api.calio360.app;

        # SSL Certificates (Let's Encrypt)
        ssl_certificate     /etc/letsencrypt/live/api.calio360.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.calio360.app/privkey.pem;

        # SSL Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ==========================================
        # SECURITY HEADERS
        # ==========================================
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none';" always;

        # ==========================================
        # AUTH ROUTES (Rate Limited - Stricter)
        # ==========================================
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://calio_gateway;
            include /etc/nginx/proxy_params;
        }

        # ==========================================
        # API ROUTES (Rate Limited)
        # ==========================================
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://calio_gateway;
            include /etc/nginx/proxy_params;
        }

        # ==========================================
        # HEALTH CHECK
        # ==========================================
        location /health {
            return 200 '{"status":"ok","service":"calio-nginx"}';
            add_header Content-Type application/json;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
