# ==========================================
# Nginx Initial Config (HTTP Only)
# Use this to obtain the first Let's Encrypt certificate.
#
# Steps:
#   1. Replace nginx.conf with this file
#   2. docker compose -f docker-compose.prod.yml up -d nginx
#   3. Run certbot to obtain the certificate
#   4. Restore the original nginx.conf
#   5. docker compose -f docker-compose.prod.yml restart nginx
# ==========================================

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name api.calio360.app calio360.app;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 200 'CALIO360 - Waiting for SSL setup';
            add_header Content-Type text/plain;
        }
    }
}
